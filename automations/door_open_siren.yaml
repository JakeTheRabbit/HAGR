# ==============================================================================
# Automation: Door Open Siren
# ------------------------------------------------------------------------------
# Triggers a siren and notifies operators when a critical door (grow room, dry
# room, vault) gets left open longer than the grace period. Cancels itself
# when the door is closed.
#
# Why it matters:
#   For licensed cultivation facilities, doors to flowering rooms, dry rooms,
#   and product storage usually have to stay closed except when in active use.
#   Leaving them open is a security-control failure and a light-leak or
#   environmental-control risk.
#
# Pair with:
#   - automations/auto_door_lock.yaml — auto-lock the door N seconds after it
#     closes, so closed-equals-locked.
#   - automations/light_leak_detection.yaml — the door siren catches intent
#     ("someone left this open"); the light-leak detector catches the
#     consequence ("light got in").
#
# Mode: restart — if the door reopens during the siren, the timer resets.
#
# SITE: replace binary_sensor.YOUR_DOOR_SENSOR and switch.YOUR_SIREN.
# ==============================================================================
alias: Door Open Siren
description: >
  Sound a siren and notify operators if a critical door has been open for
  20 seconds. Stops when the door closes.
mode: restart

trigger:
  - trigger: state
    entity_id: binary_sensor.YOUR_DOOR_SENSOR
    from: "off"
    to: "on"
    for:
      seconds: 20

action:
  - alias: Sound siren
    action: switch.turn_on
    target:
      entity_id: switch.YOUR_SIREN

  - alias: Notify operators
    action: notify.notify                       # SITE: replace
    data:
      title: "Door open"
      message: >
        {{ trigger.to_state.attributes.friendly_name }} has been open for 20s.

  - alias: Wait for the door to close
    wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.YOUR_DOOR_SENSOR
        to: "off"
        for:
          seconds: 1

  - alias: Stop siren
    action: switch.turn_off
    target:
      entity_id: switch.YOUR_SIREN
