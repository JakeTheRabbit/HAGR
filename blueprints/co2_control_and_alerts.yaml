blueprint:
  name: CO₂ Control and Alerts
  author: JakeTheRabbit (HAGR)
  homeassistant:
    min_version: "2024.10.0"
  description: >
    Day/night CO₂ setpoint control with hysteresis, plus layered safety:
    high-CO₂ auto-off (primary + optional backup sensor), relay-stuck / empty-tank
    auto-off, sustained-low alerting with optional light auto-dim and automatic
    restore, and multi-target notifications (mobile + persistent + optional TTS).

    **What changed vs. the old version**

    - Optional secondary sensor no longer breaks the automation when left blank
      (it was wired into a trigger, which fails config validation when empty).
    - High-CO₂ safety close is now respected — the control loop will not re-open
      the valve while either sensor reads high.
    - Lights dimmed on low CO₂ are snapshotted and restored automatically when
      CO₂ recovers.
    - New relay-stuck / empty-tank guard: if the CO₂ valve stays on past a max
      runtime it is forced closed and you are alerted.
    - Night target of 0 (or a dead primary sensor) now fails safe — the valve
      closes instead of freezing.
    - Modern HA syntax throughout (`triggers:`/`actions:`, `tts.speak`,
      `notify.send_message`), time parsing hardened against unavailable states,
      persistent notifications de-duplicated.

    **How it works**

    1. CO₂ control — monitors the primary sensor and switches the CO₂ device on
       below `target − tolerance`, off above `target + tolerance`. It refuses to
       open while a high-CO₂ condition is active, when the primary sensor is
       unavailable, or when the target is 0.
    2. Day/night target — the target follows your day/night values, swapped at the
       configured on/off times (handles windows that cross midnight).
    3. Low-CO₂ alerts — sustained-low triggers an alert inside a time window with a
       cooldown, and can dim lights to protect plants. Lights are restored on
       recovery.
    4. High-CO₂ safety — either sensor over its threshold closes the CO₂ valve and
       alerts. Backup sensor is optional and is polled (≤60 s) rather than
       triggered, so leaving it blank is safe.
    5. Relay-stuck safety — valve on longer than the max runtime is forced closed
       with an alert (usually an empty tank or a welded relay).

    **Helpers to add** (Settings → Devices & Services → Helpers, or YAML):

    ```yaml
    input_number:
      co2_target_input:
        name: CO₂ Target Input
        min: 0
        max: 5000
        step: 1
        unit_of_measurement: 'ppm'
        mode: box
      co2_tolerance_input:
        name: CO₂ Tolerance Input
        min: 0
        max: 1000
        step: 1
        unit_of_measurement: 'ppm'
        mode: box
      co2_day_target_input:
        name: Daytime CO₂ Target Input
        min: 0
        max: 5000
        step: 1
        unit_of_measurement: 'ppm'
        mode: box
      co2_night_target_input:
        name: Nighttime CO₂ Target Input
        min: 0
        max: 5000
        step: 1
        unit_of_measurement: 'ppm'
        mode: box
    input_datetime:
      co2_on_time:
        name: CO₂ Target On Time
        has_time: true
        has_date: false
      co2_off_time:
        name: CO₂ Target Off Time
        has_time: true
        has_date: false
      low_co2_time_start:
        name: Low CO₂ Alert Start Time
        has_time: true
        has_date: false
      low_co2_time_end:
        name: Low CO₂ Alert End Time
        has_time: true
        has_date: false
      last_low_co2_alert:
        name: Last Low CO₂ Alert Time
        has_time: true
        has_date: true
      last_high_co2_alert:
        name: Last High CO₂ Alert Time
        has_time: true
        has_date: true
    ```
  domain: automation
  input:
    section_sensors:
      name: CO₂ Sensors
      icon: mdi:molecule-co2
      input:
        co2_sensor:
          name: CO₂ Sensor
          description: The primary CO₂ sensor to monitor and control on.
          selector:
            entity:
              domain: sensor
        co2_sensor_secondary:
          name: Secondary CO₂ Sensor (Optional)
          description: >
            Backup sensor for the high-CO₂ safety cut (e.g. a second probe in the
            room or the lung room). Safe to leave blank — it is polled, not
            triggered.
          default: ""
          selector:
            entity:
              domain: sensor

    section_control:
      name: CO₂ Control
      icon: mdi:valve
      input:
        co2_control_switch:
          name: CO₂ Control Switch
          description: The switch / solenoid to control based on CO₂ levels.
          selector:
            entity:
              domain: switch
        co2_target_input:
          name: CO₂ Target Input Number
          description: input_number holding the current (live) CO₂ target.
          selector:
            entity:
              domain: input_number
        co2_tolerance_input:
          name: CO₂ Tolerance Input Number
          description: input_number for the hysteresis band (± around target).
          selector:
            entity:
              domain: input_number
        co2_day_target_input:
          name: Daytime CO₂ Target Input Number
          description: input_number for the daytime CO₂ target.
          selector:
            entity:
              domain: input_number
        co2_night_target_input:
          name: Nighttime CO₂ Target Input Number
          description: >
            input_number for the nighttime CO₂ target. Set to 0 to keep CO₂ off at
            night — the valve will be held closed (this is now handled safely).
          selector:
            entity:
              domain: input_number
        co2_on_time:
          name: CO₂ Target On Time
          description: When to switch to the daytime CO₂ target.
          selector:
            entity:
              domain: input_datetime
        co2_off_time:
          name: CO₂ Target Off Time
          description: When to switch to the nighttime CO₂ target.
          selector:
            entity:
              domain: input_datetime
        max_co2_on_minutes:
          name: Max CO₂ Valve Runtime (Minutes)
          description: >
            If the CO₂ valve stays on continuously longer than this, it is forced
            closed and an alert is sent — usually an empty tank or a stuck relay.
            Set high enough that normal injection cycles never reach it.
          default: 10
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: minutes

    section_low:
      name: Low CO₂ Alerts
      icon: mdi:arrow-down-bold
      input:
        enable_low_co2_alerts:
          name: Enable Low CO₂ Alerts
          description: Toggle low CO₂ alerts.
          default: true
          selector:
            boolean:
        low_co2_threshold:
          name: Low CO₂ Threshold
          description: CO₂ level below which to trigger an alert.
          default: 600
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: ppm
        low_co2_duration:
          name: Low CO₂ Duration (Minutes)
          description: How long below threshold before alerting (and before restore on recovery).
          default: 1
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: minutes
        low_co2_time_start:
          name: Low CO₂ Alert Start Time
          description: Start of the window in which low alerts are allowed.
          selector:
            entity:
              domain: input_datetime
        low_co2_time_end:
          name: Low CO₂ Alert End Time
          description: End of the window in which low alerts are allowed.
          selector:
            entity:
              domain: input_datetime
        low_co2_alert_cooldown:
          name: Low CO₂ Alert Cooldown (Seconds)
          description: Minimum time between low alerts.
          default: 300
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds

    section_lights:
      name: Light Auto-Dim on Low CO₂
      icon: mdi:lightbulb-on-50
      input:
        adjust_lights_on_low_co2:
          name: Adjust Lights on Low CO₂
          description: Dim lights while CO₂ is low, then restore them on recovery.
          default: true
          selector:
            boolean:
        low_co2_lights:
          name: Lights to Adjust
          description: >
            Lights to dim while CO₂ is low. Their state is snapshotted before
            dimming and restored automatically when CO₂ recovers.
          default: []
          selector:
            entity:
              domain: light
              multiple: true
        low_co2_brightness_pct:
          name: Low CO₂ Brightness Percentage
          description: Brightness to dim the selected lights to while CO₂ is low.
          default: 30
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"

    section_high:
      name: High CO₂ Safety
      icon: mdi:alert-octagon
      input:
        enable_high_co2_alerts:
          name: Enable High CO₂ Safety
          description: Toggle the high-CO₂ auto-off and alert.
          default: true
          selector:
            boolean:
        high_co2_threshold:
          name: High CO₂ Threshold (Primary)
          description: Primary-sensor level above which to close the valve and alert.
          default: 1800
          selector:
            number:
              min: 0
              max: 5000
              unit_of_measurement: ppm
        high_co2_duration:
          name: High CO₂ Duration (Seconds)
          description: How long the primary sensor must be above threshold before reacting.
          default: 11
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: seconds
        high_co2_threshold_secondary:
          name: High CO₂ Threshold (Secondary)
          description: Backup-sensor level above which to close the valve and alert.
          default: 2500
          selector:
            number:
              min: 0
              max: 5000
              unit_of_measurement: ppm
        high_co2_alert_cooldown:
          name: High CO₂ Alert Cooldown (Seconds)
          description: Minimum time between high alerts (the valve still closes regardless).
          default: 300
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds

    section_notifications:
      name: Notifications
      icon: mdi:bell
      input:
        enable_notifications:
          name: Enable Notifications
          description: Toggle push notifications.
          default: true
          selector:
            boolean:
        notification_service:
          name: Notification Targets
          description: One or more notify entities to send alerts to.
          default: []
          selector:
            entity:
              domain: notify
              multiple: true
        notification_title_low:
          name: Low CO₂ Notification Title
          default: "CO₂ LOW"
          selector:
            text:
        notification_message_low:
          name: Low CO₂ Notification Message
          default: "CO₂ is low at {{ states(co2_sensor) }} ppm. Lights dimmed to {{ low_co2_brightness_pct }}%."
          selector:
            text:
        notification_title_high:
          name: High CO₂ Notification Title
          default: "HIGH CO₂"
          selector:
            text:
        notification_message_high:
          name: High CO₂ Notification Message
          default: "{{ offending_name }} CO₂ high: {{ offending_level }} ppm. CO₂ valve closed."
          selector:
            text:

    section_tts:
      name: TTS Notifications (Optional)
      icon: mdi:account-voice
      input:
        enable_tts_notifications:
          name: Enable TTS Notifications
          description: Speak high-CO₂ alerts on a media player. Configure the engine and player below if enabled.
          default: false
          selector:
            boolean:
        tts_engine:
          name: TTS Engine
          description: The TTS entity to use (e.g. tts.google_translate_en_com or tts.piper).
          default: ""
          selector:
            entity:
              domain: tts
        tts_media_player:
          name: TTS Media Player
          description: The media player to speak the alert on.
          default: ""
          selector:
            entity:
              domain: media_player
        tts_message_high:
          name: High CO₂ TTS Message
          default: "Attention: high CO₂, {{ offending_level }} ppm. The CO₂ valve has been closed."
          selector:
            text:

    section_state:
      name: State Helpers
      icon: mdi:database-clock
      input:
        last_low_co2_alert:
          name: Last Low CO₂ Alert Datetime
          description: input_datetime used to enforce the low-alert cooldown.
          default: input_datetime.last_low_co2_alert
          selector:
            entity:
              domain: input_datetime
        last_high_co2_alert:
          name: Last High CO₂ Alert Datetime
          description: input_datetime used to enforce the high-alert cooldown.
          default: input_datetime.last_high_co2_alert
          selector:
            entity:
              domain: input_datetime

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: state
    entity_id: !input co2_sensor
    id: co2_changed
  - trigger: state
    entity_id: !input co2_target_input
    id: settings_changed
  - trigger: state
    entity_id: !input co2_tolerance_input
    id: settings_changed
  - trigger: state
    entity_id: !input co2_on_time
    id: target_time_changed
  - trigger: state
    entity_id: !input co2_off_time
    id: target_time_changed
  - trigger: time_pattern
    minutes: "/1"
    id: tick
  - trigger: numeric_state
    entity_id: !input co2_sensor
    below: !input low_co2_threshold
    for:
      minutes: !input low_co2_duration
    id: low_co2
  - trigger: numeric_state
    entity_id: !input co2_sensor
    above: !input low_co2_threshold
    for:
      minutes: !input low_co2_duration
    id: co2_recovered
  - trigger: numeric_state
    entity_id: !input co2_sensor
    above: !input high_co2_threshold
    for:
      seconds: !input high_co2_duration
    id: high_co2
  - trigger: state
    entity_id: !input co2_control_switch
    to: "on"
    for:
      minutes: !input max_co2_on_minutes
    id: switch_stuck

variables:
  # Entity ids (exposed so templates can use states()/state_attr())
  co2_sensor: !input co2_sensor
  co2_sensor_secondary: !input co2_sensor_secondary
  secondary_set: "{{ co2_sensor_secondary not in [none, '', 'unknown', 'unavailable'] }}"
  co2_target_input: !input co2_target_input
  co2_tolerance_input: !input co2_tolerance_input
  co2_day_target_input: !input co2_day_target_input
  co2_night_target_input: !input co2_night_target_input
  co2_on_time: !input co2_on_time
  co2_off_time: !input co2_off_time

  # Low alert
  enable_low_co2_alerts: !input enable_low_co2_alerts
  low_co2_threshold: !input low_co2_threshold
  low_co2_time_start: !input low_co2_time_start
  low_co2_time_end: !input low_co2_time_end
  low_co2_alert_cooldown: !input low_co2_alert_cooldown
  last_low_co2_alert_entity: !input last_low_co2_alert
  adjust_lights_on_low_co2: !input adjust_lights_on_low_co2
  low_co2_brightness_pct: !input low_co2_brightness_pct

  # High / safety
  enable_high_co2_alerts: !input enable_high_co2_alerts
  high_co2_threshold: !input high_co2_threshold
  high_co2_threshold_secondary: !input high_co2_threshold_secondary
  high_co2_alert_cooldown: !input high_co2_alert_cooldown
  last_high_co2_alert_entity: !input last_high_co2_alert

  # Notifications
  enable_notifications: !input enable_notifications
  enable_tts_notifications: !input enable_tts_notifications

  # Unique-per-automation slug for the light-restore scene
  restore_scene_id: "co2_light_restore_{{ this.entity_id.split('.')[1] if this is defined else 'co2' }}"

  # Derived: is the low-alert time window open right now? (true if window unset)
  low_window_ok: >
    {% set a = states(low_co2_time_start) %}
    {% set b = states(low_co2_time_end) %}
    {% if a in [none, '', 'unknown', 'unavailable'] or b in [none, '', 'unknown', 'unavailable'] %}
      {{ true }}
    {% else %}
      {% set a = today_at(a) %}
      {% set b = today_at(b) %}
      {% set n = now() %}
      {{ (a <= n < b) if a <= b else (n >= a or n < b) }}
    {% endif %}

  # Derived: have the cooldowns elapsed? (true if never alerted)
  low_cooldown_ok: >
    {% set s = states(last_low_co2_alert_entity) %}
    {% if s in [none, '', 'unknown', 'unavailable'] %}
      {{ true }}
    {% else %}
      {{ (now().timestamp() - as_timestamp(s)) > (low_co2_alert_cooldown | int) }}
    {% endif %}
  high_cooldown_ok: >
    {% set s = states(last_high_co2_alert_entity) %}
    {% if s in [none, '', 'unknown', 'unavailable'] %}
      {{ true }}
    {% else %}
      {{ (now().timestamp() - as_timestamp(s)) > (high_co2_alert_cooldown | int) }}
    {% endif %}

actions:
  # ── 1. Day/night target adjustment ────────────────────────────────────────
  - if:
      - condition: trigger
        id:
          - tick
          - target_time_changed
          - ha_start
    then:
      - action: input_number.set_value
        target:
          entity_id: !input co2_target_input
        data:
          value: >
            {% set on_s = states(co2_on_time) %}
            {% set off_s = states(co2_off_time) %}
            {% if on_s in [none, '', 'unknown', 'unavailable'] or off_s in [none, '', 'unknown', 'unavailable'] %}
              {{ states(co2_target_input) }}
            {% else %}
              {% set on_t = today_at(on_s) %}
              {% set off_t = today_at(off_s) %}
              {% set n = now() %}
              {% if on_t <= off_t %}
                {% set is_day = on_t <= n < off_t %}
              {% else %}
                {% set is_day = n >= on_t or n < off_t %}
              {% endif %}
              {{ states(co2_day_target_input) if is_day else states(co2_night_target_input) }}
            {% endif %}

  # ── 2. High-CO₂ safety: close valve + alert (primary or optional backup) ───
  - if:
      - condition: template
        value_template: "{{ enable_high_co2_alerts }}"
      - condition: template
        value_template: >
          {{ (states(co2_sensor) | float(-1) > (high_co2_threshold | float))
             or (secondary_set and states(co2_sensor_secondary) | float(-1) > (high_co2_threshold_secondary | float)) }}
      - condition: template
        value_template: "{{ high_cooldown_ok }}"
    then:
      - variables:
          offending_sensor: >
            {{ co2_sensor_secondary
               if (secondary_set and states(co2_sensor_secondary) | float(-1) > (high_co2_threshold_secondary | float))
               else co2_sensor }}
          offending_level: "{{ states(offending_sensor) | float(0) }}"
          offending_name: "{{ state_attr(offending_sensor, 'friendly_name') or offending_sensor }}"
      # Safety first: close the CO₂ valve before anything else.
      - action: switch.turn_off
        target:
          entity_id: !input co2_control_switch
      - if:
          - condition: template
            value_template: "{{ enable_notifications }}"
        then:
          - repeat:
              for_each: !input notification_service
              sequence:
                - action: notify.send_message
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    title: !input notification_title_high
                    message: !input notification_message_high
      - action: persistent_notification.create
        data:
          notification_id: "co2_high_{{ this.entity_id }}"
          title: !input notification_title_high
          message: !input notification_message_high
      - if:
          - condition: template
            value_template: "{{ enable_tts_notifications }}"
        then:
          - action: tts.speak
            target:
              entity_id: !input tts_engine
            data:
              media_player_entity_id: !input tts_media_player
              message: !input tts_message_high
      - action: input_datetime.set_datetime
        target:
          entity_id: !input last_high_co2_alert
        data:
          timestamp: "{{ now().timestamp() }}"

  # ── 3. Relay-stuck / empty-tank safety: valve on too long → force off ──────
  - if:
      - condition: trigger
        id: switch_stuck
    then:
      - action: switch.turn_off
        target:
          entity_id: !input co2_control_switch
      - if:
          - condition: template
            value_template: "{{ enable_notifications }}"
        then:
          - repeat:
              for_each: !input notification_service
              sequence:
                - action: notify.send_message
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    title: "CO₂ Valve Runtime Exceeded"
                    message: >
                      CO₂ valve was on longer than {{ max_co2_on_minutes }} min and has
                      been forced closed. Likely an empty tank or a stuck relay.
      - action: persistent_notification.create
        data:
          notification_id: "co2_stuck_{{ this.entity_id }}"
          title: "CO₂ Valve Runtime Exceeded"
          message: >
            CO₂ valve was on longer than {{ max_co2_on_minutes }} min and has been
            forced closed. Likely an empty tank or a stuck relay.

  # ── 4. Low-CO₂ alert + light dim ──────────────────────────────────────────
  - if:
      - condition: trigger
        id: low_co2
      - condition: template
        value_template: "{{ enable_low_co2_alerts }}"
      - condition: template
        value_template: "{{ low_window_ok }}"
      - condition: numeric_state
        entity_id: !input co2_sensor
        below: !input low_co2_threshold
      - condition: template
        value_template: "{{ low_cooldown_ok }}"
    then:
      - if:
          - condition: template
            value_template: "{{ enable_notifications }}"
        then:
          - repeat:
              for_each: !input notification_service
              sequence:
                - action: notify.send_message
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    title: !input notification_title_low
                    message: !input notification_message_low
      - if:
          - condition: template
            value_template: "{{ adjust_lights_on_low_co2 and (low_co2_lights | default([]) | length > 0) }}"
        then:
          # Snapshot current light state so we can restore it on recovery.
          - action: scene.create
            data:
              scene_id: "{{ restore_scene_id }}"
              snapshot_entities: !input low_co2_lights
          - action: light.turn_on
            target:
              entity_id: !input low_co2_lights
            data:
              brightness_pct: !input low_co2_brightness_pct
      - action: input_datetime.set_datetime
        target:
          entity_id: !input last_low_co2_alert
        data:
          timestamp: "{{ now().timestamp() }}"

  # ── 5. Low-CO₂ recovery: restore the dimmed lights ────────────────────────
  - if:
      - condition: trigger
        id: co2_recovered
      - condition: template
        value_template: "{{ adjust_lights_on_low_co2 }}"
      - condition: template
        value_template: "{{ states('scene.' ~ restore_scene_id) not in [none, '', 'unknown', 'unavailable'] }}"
    then:
      - action: scene.turn_on
        target:
          entity_id: "scene.{{ restore_scene_id }}"

  # ── 6. CO₂ control loop (hysteresis, fail-safe, high-lockout) ─────────────
  - variables:
      primary_ok: "{{ states(co2_sensor) not in [none, '', 'unknown', 'unavailable'] }}"
      co2_value: "{{ states(co2_sensor) | float(-1) }}"
      co2_target: "{{ states(co2_target_input) | float(-1) }}"
      co2_tolerance: "{{ states(co2_tolerance_input) | float(0) }}"
      high_now: >
        {{ (states(co2_sensor) | float(-1) > (high_co2_threshold | float))
           or (secondary_set and states(co2_sensor_secondary) | float(-1) > (high_co2_threshold_secondary | float)) }}
  - choose:
      # Fail-safe: primary sensor unavailable → close the valve.
      - conditions:
          - condition: template
            value_template: "{{ not primary_ok }}"
          - condition: state
            entity_id: !input co2_control_switch
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input co2_control_switch
      # Target 0 (e.g. CO₂ off at night) → keep the valve closed.
      - conditions:
          - condition: template
            value_template: "{{ primary_ok and co2_target <= 0 }}"
          - condition: state
            entity_id: !input co2_control_switch
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input co2_control_switch
      # Below lower limit → inject, but never while CO₂ is high.
      - conditions:
          - condition: template
            value_template: >
              {{ primary_ok and co2_target > 0
                 and co2_value < (co2_target - co2_tolerance)
                 and not high_now }}
          - condition: state
            entity_id: !input co2_control_switch
            state: "off"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input co2_control_switch
      # Above upper limit → stop injecting.
      - conditions:
          - condition: template
            value_template: >
              {{ primary_ok and co2_target > 0
                 and co2_value > (co2_target + co2_tolerance) }}
          - condition: state
            entity_id: !input co2_control_switch
            state: "on"
        sequence:
          - action: switch.turn_off
