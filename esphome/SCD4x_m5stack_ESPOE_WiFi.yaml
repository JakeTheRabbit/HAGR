# SCD41 Environmental Sensor — ESPHome Template
# =====================================================================
# A reusable ESPHome config for the Sensirion SCD41 CO2/temp/humidity
# sensor. Supports two hardware paths (toggle by commenting the blocks
# below):
#
#   Option A (default) : PoE board — M5Stack Core ESP32 + IP101 ethernet
#   Option B           : M5Stack Atom Lite (WiFi)
#
# Features
# --------
#   - SCD41 CO2 / temperature / humidity over I2C
#   - VPD (Vapor Pressure Deficit) calculation
#   - Daily min temperature / max CO2 with configurable reset time
#   - 5-reading rolling average for CO2 (smoothed automation trigger)
#   - Cannabis-grow CO2 status text (Deficient → Excessive)
#   - Calibration controls: forced recalibration, factory reset, and
#     a compile-time ASC (automatic self-calibration) toggle
#
# Setup
# -----
# 1. Edit the substitutions block below:
#      - `name` / `friendly_name`  — unique per device
#      - `api_key`                 — generate with `esphome rand` or the
#                                    dashboard wizard (base64 32-byte)
#      - `ota_password`            — any random string
#      - `automatic_self_calibration` / `calibration_reference_ppm`
#                                    — see comments inline
#
#    For multiple devices, copy this file or pull these substitutions
#    into a `!include` package. If you'd rather use a `secrets.yaml`,
#    replace `${api_key}` and `${ota_password}` below with
#    `!secret api_encryption_key` and `!secret ota_password`.
#
# 2. Toggle the HARDWARE / NETWORK / I2C / NETWORK INFO blocks to match
#    your board (Option A = PoE, Option B = M5Stack Atom Lite).
#
# 3. If using Option B (WiFi), also add wifi_ssid / wifi_password /
#    fallback_password substitutions (or use !secret).
#
# 4. Flash: `esphome run scd41-poe-template.yaml`
#
# License: MIT — no warranty; verify pinouts before powering anything.

substitutions:
  name: scd41-env
  friendly_name: SCD41 Environment
  comment: SCD41 environmental sensor
  # REPLACE BEFORE FLASHING — base64-encoded 32-byte key.
  # Generate with `esphome rand` or the dashboard wizard.
  api_key: "REPLACE_ME_WITH_BASE64_API_KEY"
  # REPLACE BEFORE FLASHING — any random string.
  ota_password: "REPLACE_ME_WITH_OTA_PASSWORD"
  # Set "false" to disable Automatic Self-Calibration (then re-flash).
  # ASC assumes the sensor sees fresh outdoor air (~420 ppm) at least
  # once a week — disable for sealed grow rooms or CO2-enriched spaces.
  automatic_self_calibration: "true"
  # Reference ppm value used by the "Perform Forced Calibration" button.
  # Standard outdoor reference is 420. To calibrate against a different
  # value (e.g. a known reference gas), change this and reflash.
  calibration_reference_ppm: "420"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${comment}
  name_add_mac_suffix: true

# ── HARDWARE ─────────────────────────────────────────────────────────
# Option A: PoE board (M5Stack Core ESP32 + IP101 ethernet)
esp32:
  board: m5stack-core-esp32
  framework:
    type: arduino

# Option B: M5Stack Atom Lite — comment Option A above, uncomment below
# esp32:
#   board: m5stack-atom
#   framework:
#     type: arduino

# ── NETWORK ──────────────────────────────────────────────────────────
# Option A: PoE Ethernet (IP101 PHY)
ethernet:
  type: IP101
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_IN
  phy_addr: 1
  power_pin: GPIO5
  use_address: ${name}.local
  # Uncomment for static IP
  # manual_ip:
  #   static_ip: 192.168.73.54
  #   gateway: 192.168.73.1
  #   subnet: 255.255.255.0

# Option B: WiFi (M5Stack Atom) — comment ethernet block above
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#   ap:
#     ssid: "${friendly_name} Fallback"
#     password: !secret fallback_password
# captive_portal:

# ── I2C ──────────────────────────────────────────────────────────────
# Option A: M5Stack Core Grove port pins
i2c:
  id: bus_a
  sda: GPIO16
  scl: GPIO17
  scan: true

# Option B: M5Stack Atom Lite Grove port — comment Option A above
# i2c:
#   id: bus_a
#   sda: GPIO26
#   scl: GPIO32
#   scan: true

# ── Logging / Web / API / OTA ────────────────────────────────────────
logger:

# Built-in web UI (ESPHome web_server v3 — Vue-based dashboard, log
# viewer, OTA upload). Reachable at http://<device-ip>/
# Loads assets from CDN by default; uncomment `local: true` to embed
# the assets in firmware for offline networks (costs extra flash).
web_server:
  port: 80
  version: 3
  # local: true

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    password: ${ota_password}

# Home Assistant time — drives daily min/max reset
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              auto now = id(ha_time).now();
              if (now.hour == (int) id(daily_reset_hour).state &&
                  now.minute == (int) id(daily_reset_minute).state) {
                id(daily_max_co2) = 0.0f;
                id(daily_min_temp) = 1000.0f;
              }

# Globals for daily min/max tracking (not persisted across reboots)
globals:
  - id: daily_max_co2
    type: float
    initial_value: '0'
    restore_value: false
  - id: daily_min_temp
    type: float
    initial_value: '1000'
    restore_value: false

# Configurable daily reset time (e.g. set to lights-on hour)
number:
  - platform: template
    name: "Daily Reset Hour"
    id: daily_reset_hour
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 23
    step: 1
    icon: "mdi:clock-outline"
    entity_category: config

  - platform: template
    name: "Daily Reset Minute"
    id: daily_reset_minute
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 59
    step: 1
    icon: "mdi:clock-outline"
    entity_category: config

# Calibration controls
# ─────────────────────────────────────────────────────────────────────
# Workflow for "Perform Forced Calibration":
#   1. Place sensor in stable outdoor air (or against a known reference).
#   2. Let it run for at least 3 minutes with steady readings.
#   3. Press the button. Sensor recalibrates to ${calibration_reference_ppm}.
# To calibrate against a different value, change the substitution at the
# top of this file and reflash.
button:
  - platform: template
    name: "Perform Forced Calibration"
    id: btn_perform_frc
    icon: "mdi:tune-vertical"
    entity_category: config
    on_press:
      - scd4x.perform_forced_calibration:
          id: scd41
          value: ${calibration_reference_ppm}

  - platform: template
    name: "Factory Reset Sensor"
    id: btn_factory_reset
    icon: "mdi:restore-alert"
    entity_category: config
    on_press:
      - scd4x.factory_reset: scd41

sensor:
  # SCD41 — CO2, temperature, humidity
  - platform: scd4x
    id: scd41
    i2c_id: bus_a
    update_interval: 30s
    automatic_self_calibration: ${automatic_self_calibration}
    co2:
      name: "CO2"
      id: co2_sensor
      accuracy_decimals: 0
      filters:
        - timeout:
            seconds: 60
    temperature:
      name: "Temperature"
      id: temperature_sensor
      accuracy_decimals: 2
      filters:
        - timeout:
            seconds: 60
    humidity:
      name: "Humidity"
      id: humidity_sensor
      accuracy_decimals: 1
      filters:
        - timeout:
            seconds: 60

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  # VPD (Vapor Pressure Deficit) — kPa
  # Optimal ranges: Seedlings 0.4–0.8, Veg 0.8–1.0, Flower 1.0–1.2
  - platform: template
    name: "VPD"
    id: vpd_sensor
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    state_class: measurement
    icon: "mdi:water-percent"
    update_interval: 30s
    lambda: |-
      if (!id(temperature_sensor).has_state() || !id(humidity_sensor).has_state()) {
        return NAN;
      }
      float t = id(temperature_sensor).state;
      float rh = id(humidity_sensor).state;
      float svp = 0.61078f * expf((17.27f * t) / (t + 237.3f));
      return svp * (1.0f - rh / 100.0f);

  # Daily max CO2 — reset by time.on_time above
  - platform: template
    name: "Daily Max CO2"
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    device_class: carbon_dioxide
    state_class: measurement
    icon: "mdi:molecule-co2"
    update_interval: 30s
    lambda: |-
      if (!id(co2_sensor).has_state()) return NAN;
      if (id(co2_sensor).state > id(daily_max_co2)) {
        id(daily_max_co2) = id(co2_sensor).state;
      }
      return id(daily_max_co2);

  # Daily min temperature — reset by time.on_time above
  - platform: template
    name: "Daily Min Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer-low"
    update_interval: 30s
    lambda: |-
      if (!id(temperature_sensor).has_state()) return NAN;
      if (id(temperature_sensor).state < id(daily_min_temp)) {
        id(daily_min_temp) = id(temperature_sensor).state;
      }
      return id(daily_min_temp);

  # 5-reading rolling average of CO2 — smoother trigger for automations
  - platform: copy
    source_id: co2_sensor
    name: "CO2 Moving Average"
    icon: "mdi:molecule-co2"
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

switch:
  - platform: restart
    name: "Restart"
    id: restart_switch
    entity_category: config

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  # Cannabis-grow CO2 status — categorises live CO2 into grow-relevant
  # bands. Drives dashboard cards or label-based automations.
  #   <  700 ppm : Deficient   (below ambient, ventilation issue)
  #   <  900 ppm : Low Boost   (mild enrichment)
  #   < 1200 ppm : Optimal     (peak photosynthesis under strong light)
  #   < 1500 ppm : Aggressive  (high enrichment, watch transpiration)
  #   >= 1500 ppm: Excessive   (diminishing returns, risk to operators)
  - platform: template
    name: "Cannabis CO2 Status"
    id: cannabis_co2_status
    icon: "mdi:cannabis"
    update_interval: 30s
    lambda: |-
      if (!id(co2_sensor).has_state()) return {"Unknown"};
      float c = id(co2_sensor).state;
      if (c < 700)  return {"Deficient"};
      if (c < 900)  return {"Low Boost"};
      if (c < 1200) return {"Optimal"};
      if (c < 1500) return {"Aggressive"};
      return {"Excessive"};

  # ── NETWORK INFO ────────────────────────────────────────────────────
  # Option A: Ethernet info
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

  # Option B: WiFi info (M5Stack Atom) — comment Option A above
  # - platform: wifi_info
  #   ip_address:
  #     name: "IP Address"
  #     entity_category: diagnostic
  #   ssid:
  #     name: "WiFi SSID"
  #     entity_category: diagnostic
